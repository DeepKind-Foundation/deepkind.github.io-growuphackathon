<script type="text/babel">

    // --- LINKI GLOBALNE ---

    // --- 1. HEADER ---
const Header = () => {

    }, []);

        return (
            <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#0a0510]/95 backdrop-blur-md border-b border-white/10 py-2' : 'bg-[#040b1d]/55 backdrop-blur-sm py-3'}`}>

                          {/*  <span className="text-xl md:text-2xl text-white font-adumu tracking-wide">Grow<span className="text-gradient">Up</span></span> */}
                    </a>

                    {/* Menu */}

                        <a href="#organizator" className="text-gray-300 hover:text-[#bca4e6] transition-colors">Organizatorzy</a>
                        <a href="#partnerzy" className="text-gray-300 hover:text-[#bca4e6] transition-colors">Partnerzy</a>
                        <a href="#kontakt" className="text-gray-300 hover:text-[#bca4e6] transition-colors">Kontakt</a>
                    </div>
                </nav>
            </header>
        );
    };

    // --- 2. HERO ---
    const HeroSection = () => (
        <section className="min-h-screen flex items-center justify-center text-center px-4 pt-32 md:pt-36 hero-gradient relative overflow-hidden font-poppins">

            {/* Background Decorations */}
            <div className="hero-beam-left"></div>
            <div className="hero-beam-right"></div>
            <div className="absolute top-[16%] left-[10%] w-56 h-56 border border-[#b779ff]/20 rounded-full"></div>
            <div className="absolute bottom-[14%] right-[-4%] w-72 h-72 bg-[#84cc16]/18 rounded-full blur-[120px]"></div>
            <div className="absolute top-[12%] right-[12%] w-80 h-80 border border-[#22c55e]/20 rounded-full"></div>

            <div className="max-w-5xl z-10 hero-panel poster-outline rounded-[32px] px-6 md:px-12 py-10 md:py-14">
                <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-white/5 border border-white/10 mb-8">
                    <span className="accent-dot"></span>
                    <span className="text-xs font-bold uppercase tracking-[0.28em] text-slate-200">Hackathon 2026</span>
                </div>

                <h1 className="text-5xl md:text-7xl lg:text-[7rem] font-normal text-white leading-[0.94] mb-5 tracking-tight font-adumu uppercase">
                    Grow<span className="text-gradient">Up</span>
                </h1>

                <h2 className="text-2xl md:text-4xl lg:text-5xl font-black uppercase mb-8 tracking-tight">
                    <span className="text-violet-400">Hackuj dorosłość,</span>{' '}
                    <span className="text-lime-400">wymyśl lepsze jutro</span>
                </h2>

                <p className="text-lg md:text-xl text-slate-300 max-w-3xl mx-auto mb-10 leading-relaxed">
                    Ogólnopolski hackathon dla młodych ludzi, który łączy technologię, innowacje i empatię, aby ułatwić wchodzenie w dorosłe życie.
                    <br className="hidden md:block" />
                    <br /><br />
                    Pracuj w zespole, testuj pomysły, prototypuj, korzystaj z wiedzy mentorów i stwórz rozwiązanie, które może zmienić czyjeś (i Twoje) życie.
                </p>

                <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <button disabled className="btn-gradient opacity-50 cursor-not-allowed text-[#081120] text-lg font-extrabold py-4 px-10 rounded-full flex items-center justify-center gap-2 uppercase tracking-[0.08em]">
                        Chcę wziąć udział <i className="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>
    );

    // --- 3. O PROJEKCIE ---
    const AboutSection = () => (
        <section id="o-projekcie" className="py-24 px-4 section-glow relative">
            <div className="container mx-auto max-w-6xl section-shell rounded-[32px] px-6 md:px-10 py-12 md:py-16">
                <div className="max-w-4xl mx-auto">
                    <div>
                            <h2 className="section-title text-3xl md:text-5xl font-bold mb-8 leading-tight text-center">
                                Praktyczne <span className="text-gradient">laboratorium dorosłości</span>
                            </h2>

                            <div className="space-y-6 text-gray-300 text-lg leading-relaxed">
                                <p>
                                    Nikt nie uczy nas, jak być dorosłym — szkoła nie tłumaczy, jak ogarnąć własny budżet, dbać o zdrowie psychiczne, kiedy wszystko dookoła stresuje, ani jak radzić sobie z presją internetu. Dlatego powstał GrowUp — praktyczne laboratorium dorosłości, w którym młodzi ludzie projektują technologiczne rozwiązania realnych problemów swojego pokolenia.
                                </p>
                                <p>
                                    To nie jest zwykły hackathon: zamiast jednego intensywnego weekendu uczestnicy mają cały miesiąc pracy w pełni online, żeby rozwinąć swój pomysł od idei aż po działający prototyp. W tym czasie zespoły z całej Polski (łącznie 30 drużyn) pracują nad swoimi projektami, ucząc się jak prowadzić je krok po kroku pod okiem mentorów, ekspertów i konsultantów z branży.
                                </p>
                                <p>
                                    Wpadacie ze swoimi pomysłami albo dołączacie do innych, tworzycie zespoły i wspólnie budujecie aplikacje, strony lub narzędzia — może to być aplikacja wspierająca zdrowie psychiczne, narzędzie do nauki finansów osobistych albo system, który krok po kroku tłumaczy pierwsze podatki.
                                </p>

                                    Na końcu 5 najlepszych zespołów prezentuje swoje projekty podczas finału w Krakowie, gdzie mają szansę pokazać swoje rozwiązania, zdobyć feedback i rozwinąć je dalej.

    );

    // --- 3.5. ŚCIEŻKI TEMATYCZNE ---
    const PathsSection = () => {
        const paths = [
            {
                title: "Grow Self",
                desc: `Jak dorosnąć w XXI wieku i nie zwariować?

W dobie niestabilności geopolitycznej, kryzysu klimatycznego i wszechobecnej presji sukcesu, odnalezienie własnej drogi staje się wyzwaniem ekstremalnym. Tradycyjne metody wsparcia często nie nadążają za tempem zmian. Twoim zadaniem jest zaprojektowanie rozwiązania, które pomoże naszym rówieśnikom zadbać o zdrowie psychiczne, wypracować autentyczną równowagę (work-life-tech balance) i głębiej poznać siebie.

„Nie ma ucieczki przed formą, jak tylko w inną formę” – pisał Witold Gombrowicz. Skoro nie uciekniemy od technologii i współczesnych struktur, stwórzmy ich nową, lepszą formę: taką, która wspiera człowieka, zamiast go przytłaczać.`,
                icon: "ph-user"
            },
            {
                title: "Grow Together",
                desc: `Jak nie być samotnym w tłumie?

Ludzie to zwierzęta stadne, lecz w świecie algorytmów coraz częściej o tym zapominamy. Budowanie i utrzymywanie wartościowych relacji staje się trudniejsze niż kiedykolwiek, a ekrany, które miały nas łączyć, paradoksalnie wznoszą między nami bariery. Samotność stała się chorobą cywilizacyjną, dotykającą nas bez względu na liczbę "znajomych" w sieci.

„Ludzie mają zbyt mało czasu, aby cokolwiek poznać. Kupują w sklepach rzeczy gotowe. A ponieważ nie ma magazynów z przyjaciółmi, więc ludzie nie mają przyjaciół” – pisał Antoine de Saint-Exupéry. W świecie nastawionym na szybką konsumpcję relacji, zapomnieliśmy o procesie ich uważnego budowania.`,
                icon: "ph-users-three"
            },
            {
                title: "Grow Skills",
                desc: `Jak uczyć się jutra, które dzieje się dziś?

System edukacji często przypomina mapę do świata, który już nie istnieje. W obliczu rewolucji AI i błyskawicznej dezaktualizacji wiedzy, kluczową kompetencją nie jest już "wiedzieć", ale "potrafić się uczyć" i krytycznie analizować rzeczywistość. Musimy wyposażyć się w narzędzia, które pozwolą nam nawigować po rynku pracy, który zmienia się na naszych oczach.

„Wiedza to jedyna rzecz, która się mnoży, gdy się ją dzieli” – pisał Andrzej Majewski. W erze sztucznej inteligencji to współdzielenie wiedzy i umiejętność współpracy z technologią, a nie walka z nią, stanie się naszym największym atutem.`,
                icon: "ph-brain"
            },
            {
                title: "Grow Impact",
                desc: `Jak zostawić świat lepszym, niż go zastaliśmy?

Technologia rośnie szybciej niż nasza refleksja nad jej skutkami. Stoimy przed wyzwaniami, które nie uznają granic: od kryzysu klimatycznego po dylematy etyczne związane z automatyzacją życia. Mamy potężne narzędzia, ale musimy nadać im kierunek, który służy wspólnemu dobru, a nie tylko chwilowemu zyskowi.

„Bądź zmianą, którą chcesz ujrzeć w świecie” – te słowa Mahatmy Gandhiego nabierają nowego znaczenia w erze cyfrowej. Nasza sprawczość jako obywateli i twórców technologii jest większa niż kiedykolwiek – pytanie brzmi, jak ją wykorzystamy.`,
                icon: "ph-globe-hemisphere-west"
            },
            {
                title: "Grow Everyday",
                desc: `Jak ogarnąć dorosłość i nie stracić sensu?

Dorosłość często kojarzy się z wielkimi decyzjami i spektakularnymi sukcesami. Tymczasem większość naszego życia składa się z dużo prostszych rzeczy: zapłacenia rachunków, umówienia wizyty u lekarza, zorganizowania budżetu czy znalezienia czasu na odpoczynek. To właśnie w tej codzienności uczymy się samodzielności. Małe zadania potrafią być zaskakująco trudne - szczególnie gdy nikt wcześniej nie pokazał nam, jak je ogarnąć.

"Wszyscy powinniśmy przynajmniej raz w życiu dostać owację na stojąco, bo przecież każdy z nas zwycięża ten świat." - R. J. Palacio, "Cudowny chłopak". W tej ścieżce szukamy pomysłów, które pomagają ludziom lepiej radzić sobie z codziennością: upraszczają organizację życia, pomagają zarządzać finansami czy budować dobre nawyki. Bo czasem największą innowacją nie jest zmiana świata - tylko sprawienie, że zwykłe życie staje się trochę łatwiejsze.`,
                icon: "ph-calendar-check"
            },
        ];

        return (
            <section id="sciezki" className="py-24 px-4 relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(157,78,221,0.18),transparent_45%),radial-gradient(circle_at_80%_75%,rgba(132,204,22,0.14),transparent_40%)] pointer-events-none"></div>

                                    <div className="lg:grid lg:grid-cols-[220px_1fr]">

                                            <div className="w-14 h-14 bg-[#84cc16]/10 border border-[#84cc16]/30 rounded-xl flex items-center justify-center mb-5 text-[#d8ff72]">

                a: "Nie, nie trzeba umieć programować. Jako uczestnik hackathonu będziesz mieć dostęp do materiałów, które pomogą Ci zdobyć potrzebne umiejętności. Poza tym oceniany jest cały projekt – pomysł, koncepcja, prezentacja i współpraca w zespole – a nie tylko sam kod. Projekt może być nawet 'vibekodowany' (czyli tworzony w bardziej kreatywny, eksperymentalny sposób), ale warto mieć w zespole przynajmniej jedną osobę, która czuje się pewniej w programowaniu i będzie mogła wesprzeć część techniczną. Dzięki temu każdy znajdzie coś dla siebie, nawet jeśli nie jest pewny swoich umiejętności kodowania."
            },
            {
                q: "W jakiej formie odbywa się hackathon?",
                a: "Miesiąc rozwoju odbywa się online, natomiast potem najlepsze drużyny przedstawią swoje projekty na finale, który odbędzie się na żywo w Krakowie."
            },
            {
                q: "Czy udział coś kosztuje?",
                a: "Nie, udział nic nie kosztuje."
            },
            {
                q: "Umiem bardzo dobrze programować, czego mogę się nauczyć?",
                a: "Podczas hackathonu uczestnicy będą się uczyć jak prowadzić projekty od idei do wdrożenia. Przewidujemy szkolenia z m.in. product development, marketingu, UX design."
            },
            {
                q: "Czy trzeba mieć zespół przy zgłaszaniu się?",
                a: "Uczestnicy mogą zgłaszać się w zespołach do 5 osób lub samodzielnie. W przypadku pojedynczego zgłoszenia połączymy cię na platformie Discord z innymi uczestnikami bez drużyn w celu stworzenia ich."
            }
        ];

        return (
            <section id="faq" className="py-24 px-4 relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(circle_at_80%_20%,rgba(132,204,22,0.14),transparent_45%),radial-gradient(circle_at_10%_80%,rgba(157,78,221,0.12),transparent_50%)] pointer-events-none"></div>
                <div className="container mx-auto max-w-3xl relative z-10">
                    <div className="text-center mb-16">
                        <h2 className="section-title text-4xl md:text-5xl font-bold mb-4">
                            Pytania i <span className="text-gradient">Odpowiedzi</span>
                        </h2>
                        <p className="text-slate-400">Znajdź odpowiedzi na najczęstsze pytania</p>
                    </div>

                    <div className="space-y-4">
                        {faqs.map((faq, idx) => (
                            <div
                                key={idx}
                                className="puzzle-block rounded-2xl overflow-hidden border border-white/10 transition-all duration-300 cursor-pointer hover:border-[#84cc16]/40"
                                onClick={() => setOpenIndex(openIndex === idx ? null : idx)}
                            >
                                <div className="px-6 md:px-8 py-5 md:py-6 flex items-center justify-between bg-gradient-to-r from-[#0a1530] to-[#081124]">
                                    <h3 className="text-lg md:text-xl font-bold text-white pr-4">{faq.q}</h3>
                                    <div className={`shrink-0 text-[#a3e635] transition-transform duration-300 ${openIndex === idx ? 'rotate-180' : ''}`}>
                                        <i className="ph-bold ph-caret-down text-2xl"></i>
                                    </div>
                                </div>
                                {openIndex === idx && (
                                    <div className="px-6 md:px-8 py-6 border-t border-white/10 bg-white/[0.02]">
                                        <p className="text-gray-300 leading-relaxed">{faq.a}</p>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );
    };

    // --- 8. STOPKA ---
    const FooterSection = () => {
        return (
            <footer id="kontakt" className="pt-14 pb-8 px-4 border-t border-white/5">
                <div className="container mx-auto max-w-4xl text-center section-shell rounded-[32px] px-6 md:px-10 py-8 md:py-10">

                    <h2 className="text-2xl font-bold mb-5 text-white">Kontakt</h2>

                    <div className="flex flex-col md:flex-row justify-center items-center gap-4 text-base text-gray-300 mb-10">
                        <a href="mailto:kontakt@growuphackathon.pl" className="hover:text-[#d8ff72] transition-colors flex items-center gap-2">
                            <i className="ph-bold ph-envelope"></i> kontakt@growuphackathon.pl
                        </a>
                        <span className="hidden md:inline text-gray-700">|</span>
                        <div className="flex gap-3">
                            <a href={INSTA_LINK} target="_blank" className="hover:text-pink-500 transition-transform hover:scale-110"><i className="ph-fill ph-instagram-logo text-2xl"></i></a>
                            <a href={FB_LINK} target="_blank" className="hover:text-blue-600 transition-transform hover:scale-110"><i className="ph-fill ph-facebook-logo text-2xl"></i></a>
                        </div>
                    </div>

                    <div className="border-t border-white/10 pt-8">
                        <div className="flex flex-col md:flex-row justify-center gap-2 text-xs text-gray-500">
                            <a href={REGULAMIN_LINK} target="_blank" className="hover:text-gray-300 underline underline-offset-2">Regulamin</a>
                            <a href={PRIVACY_LINK} target="_blank" className="hover:text-gray-300 underline underline-offset-2">Polityka Prywatności (RODO)</a>
                        </div>

                        <div className="mt-6 text-gray-700 text-[10px] uppercase tracking-[0.18em]">
                            &copy; 2026 GrowUp Hackathon. Powered by DeepKind.
                        </div>
                    </div>

                </div>
            </footer>
        );
    };

    // --- BOTTOM CTA ---
    const BottomCTASection = () => (
        <section className="py-20 px-4 relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(132,204,22,0.12),transparent_60%)] pointer-events-none"></div>
            <div className="container mx-auto max-w-3xl relative z-10 text-center">
                <h2 className="text-3xl md:text-4xl font-bold text-white mb-4">
                    Gotowy, żeby <span className="text-gradient">hackować dorosłość?</span>
                </h2>
                <p className="text-gray-400 mb-10 text-lg">Dołącz do listy oczekujących i nie przegap startu zapisów.</p>
                <a href={WAITLIST_FORM_LINK} target="_blank" className="btn-gradient text-[#081120] text-xl font-extrabold py-5 px-16 rounded-full inline-flex items-center gap-2 uppercase tracking-[0.08em]">
                    Chcę wziąć udział <i className="ph-bold ph-arrow-right"></i>
                </a>
            </div>
        </section>
    );

    // --- BANER COOKIES ---
    const CookieBanner = () => {
        const [isVisible, setIsVisible] = React.useState(true);
        if (!isVisible) return null;

        return (
            <div className="fixed bottom-0 left-0 right-0 bg-[#061022]/92 backdrop-blur-xl border-t border-[#84cc16]/20 p-4 z-50 flex flex-col md:flex-row justify-center items-center gap-6 text-sm text-gray-300">
                <p className="text-center md:text-left max-w-3xl">
                    Ta strona używa plików cookies w celu świadczenia usług na najwyższym poziomie. Dalsze korzystanie ze strony oznacza, że zgadzasz się na ich użycie.
                </p>
                <button onClick={() => setIsVisible(false)} className="px-6 py-2 bg-[#84cc16] hover:bg-[#a3e635] text-[#081120] rounded-full transition-colors font-bold shrink-0">
                    Zgadzam się
                </button>
            </div>
        );
    };

    // --- MAIN APP ---
    const App = () => (
        <React.Fragment>
            <Header />
            <main>
                <HeroSection />
                <AboutSection />
                <PathsSection />
                <StagesSection />
                <BenefitsSection />
                <WaitlistSection />
                <FAQSection />
                <OrganizersSection />
                <PartnersSection />
                <BottomCTASection />
            </main>
            <FooterSection />
            <CookieBanner />
        </React.Fragment>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
